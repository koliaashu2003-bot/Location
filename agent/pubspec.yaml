name: family_tracker_agent
description: "Family Location Tracker Agent - tracks location and screen time, sends to Telegram and Firestore."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Location
  geolocator: ^11.0.0

  # Background service + notifications
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^17.0.0

  # Firebase
  cloud_firestore: ^4.17.0
  firebase_core: ^2.31.0

  # Networking (Telegram)
  http: ^1.2.0

  # Persistence
  shared_preferences: ^2.2.0

  # Screen time / usage stats
  usage_stats: ^1.2.0

  # Battery level
  battery_plus: ^6.0.0

  # Permissions
  permission_handler: ^11.3.0

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
